<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>UI Reconstruct Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #222;
      background: #f7f7f7;
    }
    label { display: block; margin: 8px 0 4px; color: #555; }
    input {
      width: 100%;
      height: 30px;
      padding: 0 8px;
      border: 1px solid #c9c9c9;
      border-radius: 4px;
      background: #fff;
      color: #222;
    }
    button {
      width: 100%;
      height: 32px;
      margin-top: 10px;
      border: 0;
      border-radius: 4px;
      background: #1769e0;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #9bb6dc; cursor: default; }
    #status { margin-top: 8px; color: #666; min-height: 16px; }
    #error { margin-top: 4px; color: #b42318; min-height: 14px; }
  </style>
</head>
<body>
  <label for="bridge-url">Bridge URL</label>
  <input id="bridge-url" type="text" value="ws://localhost:8765" />

  <label for="plugin-token">Plugin token</label>
  <input id="plugin-token" type="password" autocomplete="off" />

  <button id="save-connect" type="button">Save and connect</button>
  <div id="status">Loading configuration...</div>
  <div id="error"></div>

  <script>
    const urlEl = document.getElementById("bridge-url");
    const tokenEl = document.getElementById("plugin-token");
    const saveEl = document.getElementById("save-connect");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    let ws = null;
    let reconnectTimer = null;
    let reconnectEnabled = true;

    function pluginUrl(baseUrl) {
      const base = String(baseUrl || "").trim().replace(/\/+$/, "");
      if (!/^wss?:\/\//.test(base)) {
        throw new Error("Bridge URL must start with ws:// or wss://");
      }
      return `${base}/plugin`;
    }

    function requestConfig() {
      parent.postMessage({ pluginMessage: { type: "plugin-config-request" } }, "*");
    }

    function connect() {
      clearTimeout(reconnectTimer);
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      errorEl.textContent = "";
      let target;
      try {
        target = pluginUrl(urlEl.value);
      } catch (err) {
        statusEl.textContent = "Configuration error";
        errorEl.textContent = err.message;
        return;
      }
      statusEl.textContent = "Connecting...";
      ws = new WebSocket(target);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "auth",
          token: tokenEl.value,
        }));
        if (!tokenEl.value) {
          statusEl.textContent = "Connected";
        } else {
          statusEl.textContent = "Authenticating...";
        }
      };

      ws.onmessage = (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch (err) {
          return;
        }
        if (message.type === "auth-ok") {
          statusEl.textContent = "Connected";
          return;
        }
        if (message.type === "auth-error") {
          statusEl.textContent = "Authentication failed";
          errorEl.textContent = "Check the plugin token and bridge configuration.";
          reconnectEnabled = false;
          ws.close();
          return;
        }
        // A no-token bridge does not send auth-ok; the first command proves
        // that the socket is attached.
        statusEl.textContent = "Connected";
        parent.postMessage({ pluginMessage: message }, "*");
      };

      ws.onclose = (event) => {
        if (event && event.code === 4004) {
          reconnectEnabled = false;
          statusEl.textContent = "Token rotated or revoked";
          errorEl.textContent = "Enter the new plugin token and save to reconnect.";
          return;
        }
        if (event && event.code === 4003) {
          reconnectEnabled = false;
          statusEl.textContent = "Authentication failed";
          errorEl.textContent = "Check the plugin token and bridge configuration.";
          return;
        }
        if (!reconnectEnabled) return;
        statusEl.textContent = "Disconnected; retrying in 5 seconds";
        reconnectTimer = setTimeout(connect, 5000);
      };

      ws.onerror = () => {
        statusEl.textContent = "Connection error";
      };
    }

    saveEl.addEventListener("click", () => {
      saveEl.disabled = true;
      errorEl.textContent = "";
      reconnectEnabled = true;
      parent.postMessage({
        pluginMessage: {
          type: "save-plugin-config",
          config: {
            bridgeUrl: urlEl.value,
            pluginToken: tokenEl.value,
          },
        },
      }, "*");
    });

    window.addEventListener("message", (event) => {
      const message = event.data && event.data.pluginMessage;
      if (!message) return;
      if (message.type === "plugin-config") {
        const config = message.config || {};
        urlEl.value = config.bridgeUrl || "ws://localhost:8765";
        tokenEl.value = config.pluginToken || "";
        saveEl.disabled = false;
        connect();
        return;
      }
      if (message.type === "plugin-config-saved") {
        saveEl.disabled = false;
        connect();
      }
    });

    requestConfig();
  </script>
</body>
</html>
