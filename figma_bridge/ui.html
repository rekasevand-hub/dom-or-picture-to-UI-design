<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>UI Reconstruct Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      font-size: 12px;
      color: #333;
    }
    #status { color: #999; }
  </style>
</head>
<body>
  <div id="status">连接中...</div>
  <script>
    const statusEl = document.getElementById('status');
    let ws;

    function connect() {
      ws = new WebSocket('ws://localhost:8765/plugin');

      ws.onopen = () => {
        statusEl.textContent = '已连接到桥接服务器';
      };

      ws.onmessage = (event) => {
        // 收到服务器命令，转发给 Figma 插件主线程
        parent.postMessage({ pluginMessage: JSON.parse(event.data) }, '*');
      };

      ws.onclose = () => {
        statusEl.textContent = '连接已断开，5 秒后重连';
        setTimeout(connect, 5000);
      };

      ws.onerror = (err) => {
        statusEl.textContent = '连接错误';
        console.error('WebSocket error:', err);
      };
    }

    // 接收来自 Figma 插件主线程的响应，转发给服务器
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'response' && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    });

    connect();
  </script>
</body>
</html>
