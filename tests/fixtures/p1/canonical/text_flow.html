<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Canonical text and flow fixture</title>
</head>
<body style="margin:0;background:#ffffff">
  <main style="box-sizing:border-box;width:900px;min-height:700px;padding:24px;font-family:Arial,'Microsoft YaHei',sans-serif;color:#18212f">
    <h1 style="margin:0;width:852px;height:40px;font-size:32px;line-height:40px;font-weight:700">Canonical 混合文本</h1>
    <p style="margin:16px 0 0;width:520px;height:78px;font-size:18px;line-height:26px">第一行 Chinese and English stay in one paragraph. This longer second sentence exercises automatic wrapping without changing the declared block height.</p>
    <section style="box-sizing:border-box;margin-top:20px;width:360px;height:96px;padding:16px;background:#eef5ff;border:1px solid #2f6fed">
      Flow block keeps native text and a fixed-height contract.
    </section>
  </main>
